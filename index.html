<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Guia Turístico da Paraíba</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="container">
    <h1>Guia Turístico da Paraíba</h1>

    <!-- Formulário para criar/editar local -->
    <form id="formLocal">
      <input type="text" id="titulo" placeholder="Título" required/>
      <textarea id="descricao" placeholder="Descrição" required></textarea>
      <input type="text" id="foto" placeholder="Link da Foto" required/>
      <button type="submit">Salvar</button>
    </form>

    <!-- Lista de locais -->
    <div id="listaLocais"></div>
  </div>

  <script src="./script.js"></script>
</body>
</html>
